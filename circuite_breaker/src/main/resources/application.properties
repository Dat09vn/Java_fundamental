spring.application.name=circuite_breaker

payment.service.url=https://example.com/payments/charge

resilience4j.circuitbreaker.instances.paymentService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.paymentService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.paymentService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.paymentService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.paymentService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.paymentService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.paymentService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.paymentService.recordExceptions=java.lang.Exception,java.lang.RuntimeException
resilience4j.circuitbreaker.instances.paymentService.ignoreExceptions=java.lang.IllegalArgumentException

logging.level.io.github.resilience4j=INFO
logging.level.org.springframework.web.client=DEBUG
