spring.application.name=jpa

# Oracle DB connection
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521:XE}
spring.datasource.username=${DB_USER:system}
spring.datasource.password=${DB_PASSWORD:Oracle123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Nếu dùng đúng user schema đã tạo table employees, có thể bỏ qua phần init này.
# spring.sql.init.mode=always
# spring.sql.init.schema-locations=classpath:schema-oracle.sql


#add log
logging.file.name=app.log
# logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
spring.output.ansi.enabled=always

